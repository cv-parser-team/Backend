name: luminacv

x-application: &application
  build:
    context: ..
    dockerfile: Dockerfile
  image: luminacv-application:${IMAGE_TAG:-local}
  env_file:
    - ${APP_ENV_FILE:-/srv/luminacv/shared/app.env}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped
  init: true

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 768m
    logging:
      options:
        max-size: 10m
        max-file: "3"

  rabbitmq:
    image: rabbitmq:4.4.0-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m
    logging:
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *application
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    profiles: ["tools"]

  api:
    <<: *application
    command: ["npm", "start"]
    volumes:
      - documents_data:/app/.data/documents
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/docs/json').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    logging:
      options:
        max-size: 10m
        max-file: "3"

  worker:
    <<: *application
    command: ["npm", "run", "worker"]
    volumes:
      - documents_data:/app/.data/documents
    mem_limit: 1024m
    logging:
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
  rabbitmq_data:
  documents_data:
  caddy_data:
  caddy_config:
